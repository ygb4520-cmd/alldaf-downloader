name: Build and attach exe

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set version from release tag
        shell: pwsh
        run: |
          $v = "${{ github.event.release.tag_name }}".TrimStart('v')
          (Get-Content alldaf_downloader.py -Raw) -replace '(?m)^VERSION = .*$', "VERSION = `"$v`"" | Set-Content alldaf_downloader.py -Encoding utf8

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build exe
        run: python -m PyInstaller --onefile --windowed --icon=icon.ico alldaf_downloader.py

      - name: Attach to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/alldaf_downloader.exe --clobber
